pipeline:
  bow_vocabulary_path: "/opt/pool_slam/vocab/pool_vocab_10k.bin"

camera:
  width: 640
  height: 480
  intrinsics:
    fx: 525.40
    fy: 525.85
    cx: 319.50
    cy: 239.80
  # 4-parameter Brown-Conrady distortion [k1, k2, p1, p2]
  distortion_coeffs: [-0.2814, 0.0912, 0.0004, -0.0002]

extrinsics:
  # Accepts either a 3x4 [R | t] block or a full 4x4 homogeneous SE(3) matrix
  T_body_camera:
    - [ 0.0,  0.0,  1.0,  0.12]
    - [-1.0,  0.0,  0.0,  0.00]
    - [ 0.0, -1.0,  0.0, -0.04]
    - [ 0.0,  0.0,  0.0,  1.00]
  t_body_depth: [-0.15, 0.00, 0.05]